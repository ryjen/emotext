[tasks.setup]
description = "Install Hex/Rebar dependencies and project dependencies"
run = """
mix local.hex --force
mix local.rebar --force
mix deps.get
"""

[tasks.format]
description = "Check Elixir formatting"
run = "mix format --check-formatted"

[tasks.compile]
description = "Compile with warnings treated as errors"
run = "mix compile --warnings-as-errors"

[tasks.test]
description = "Run the test suite"
run = "MIX_ENV=test mix test"



[tasks.lint]
description = "Run correctness-focused Credo checks"
run = "MIX_ENV=test mix credo --strict"

[tasks.deps-audit]
description = "Audit Hex retirements/advisories and Elixir security advisories"
run = """
mix hex.audit
MIX_ENV=test mix deps.audit
"""

[tasks.security]
description = "Run source and Phoenix security gates"
run = """
gitleaks dir . --redact --no-banner
MIX_ENV=test mix sobelow --private --exit high
mise run deps-audit
"""

[tasks.assets]
description = "Build frontend assets"
run = """
mix assets.setup
mix assets.build
"""

[tasks.release]
description = "Build the production release"
run = "MIX_ENV=prod mix release"

[tasks.check]
description = "Canonical local/CI validation"
run = """
mise run format
mise run compile
mise run test
mise run lint
mise run security
mise run assets
"""
