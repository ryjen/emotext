[tasks.setup]
description = "Install Hex/Rebar dependencies and project dependencies"
run = """
mix local.hex --force
mix local.rebar --force
mix deps.get
"""

[tasks.format]
description = "Check Elixir formatting"
run = "mix format --check-formatted"

[tasks.compile]
description = "Compile with warnings treated as errors"
run = "mix compile --warnings-as-errors"

[tasks.test]
description = "Run the test suite"
run = "MIX_ENV=test mix test"

[tasks.lint]
description = "Enforce high-priority Credo correctness warnings"
run = "MIX_ENV=test mix credo --min-priority high"

[tasks.security]
description = "Check source for embedded secrets and high-confidence Phoenix risks"
run = """
set -eu
source_tree="$(mktemp -d)"
trap 'rm -rf -- "$source_tree"' EXIT
git archive HEAD | tar -x -C "$source_tree"
gitleaks dir "$source_tree" --redact --no-banner
MIX_ENV=test mix sobelow --private --threshold high --exit high
"""

[tasks.assets]
description = "Build frontend assets"
run = """
mix assets.setup
mix assets.build
"""

[tasks.release]
description = "Build the production release"
run = "MIX_ENV=prod mix release"

[tasks.check]
description = "Canonical local/CI validation"
run = """
mise run format
mise run compile
mise run test
mise run lint
mise run security
mise run assets
"""
