name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: emotext_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout exact head
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@e9bfc9148566ca239aef4f5cb968674de15c3c20 # v3.5.2

      - name: Check flake evaluation
        run: nix flake check --no-build

      - name: Install project dependencies
        run: nix develop --command mise run setup

      - name: Validate
        run: nix develop --command mise run check


      - name: Chromium chat rendering security regression
        run: |
          set -euo pipefail
          python3 -m http.server 18765 --bind 127.0.0.1 >/dev/null 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          browser="$(command -v google-chrome || command -v chromium || true)"
          test -n "$browser"
          for attempt in $(seq 1 20); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:18765/test/browser/chat-rendering.html; then
              break
            fi
            sleep 0.2
          done
          html="$("$browser" --headless=new --disable-gpu --disable-dev-shm-usage \
            --no-sandbox --virtual-time-budget=5000 --dump-dom \
            http://127.0.0.1:18765/test/browser/chat-rendering.html 2>/dev/null)"
          if ! grep -q 'data-browser-smoke="pass"' <<< "$html"; then
            echo "$html" | grep -A2 'id="result"' || true
            exit 1
          fi
          echo "BROWSER_SMOKE=PASS (actual module source in Chromium; fake transport)"
