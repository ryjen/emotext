name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: emotext_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout exact head
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@e9bfc9148566ca239aef4f5cb968674de15c3c20 # v3.5.2

      - name: Check flake evaluation
        run: nix flake check --no-build

      - name: Validate production Dockerfile syntax
        run: docker buildx build --check --file Dockerfile .

      - name: Verify flake lock is current
        run: git diff --exit-code -- flake.lock

      - name: Install Mix tooling
        run: |
          nix develop --command mix local.hex --force
          nix develop --command mix local.rebar --force

      - name: Diagnose exact dependency graph mismatch (temporary)
        run: |
          nix develop --command mix deps.get
          git diff -- mix.lock
          git diff --exit-code -- mix.lock

      - name: Verify dependency lock is unchanged
        run: git diff --exit-code -- mix.lock

      - name: Audit locked dependencies for advisories and retirements
        run: nix develop --command mix hex.audit

      - name: Validate
        run: nix develop --command mise run check

      - name: Chromium chat rendering security regression
        run: |
          set -euo pipefail
          python3 -m http.server 18765 --bind 127.0.0.1 >/dev/null 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          browser="$(command -v google-chrome || command -v chromium || true)"
          test -n "$browser"
          for attempt in $(seq 1 20); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:18765/test/browser/chat-rendering.html; then
              break
            fi
            sleep 0.2
          done
          html="$("$browser" --headless=new --disable-gpu --disable-dev-shm-usage \
            --no-sandbox --virtual-time-budget=5000 --dump-dom \
            http://127.0.0.1:18765/test/browser/chat-rendering.html 2>/dev/null)"
          if ! grep -q 'data-browser-smoke="pass"' <<< "$html"; then
            echo "$html" | grep -A2 'id="result"' || true
            exit 1
          fi
          echo "BROWSER_SMOKE=PASS (actual module in Chromium; fake transport)"

      - name: Build production release
        run: |
          nix develop --command sh -eu -c '
            MIX_ENV=prod mix assets.deploy
            MIX_ENV=prod mix release
          '

  production-image-smoke:
    if: github.event_name == 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: emotext_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout proposed receiving merge tree
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Bind smoke evidence to the exact PR head and receiving merge
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD^2)" = "$EXPECTED_HEAD"
          echo "MERGE_PARENT_BASE=$(git rev-parse HEAD^1)"
          test -f lib/emotext/runtime_secret.ex
          grep -Fq 'Emotext.RuntimeSecret.fetch!' config/runtime.exs

      - name: Build actual production image without publication
        run: docker build --file Dockerfile --tag emotext-ci-smoke:"${{ github.event.pull_request.head.sha }}" .

      - name: Prove non-root startup with PostgreSQL and read-only file secret
        env:
          IMAGE: emotext-ci-smoke:${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          work="$(mktemp -d "$RUNNER_TEMP/emotext-oci-XXXXXXXX")"
          name="emotext-smoke-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cleanup() {
            rc=$?
            if [ "$rc" -ne 0 ]; then docker logs "$name" 2>&1 || true; fi
            docker rm -f "$name" >/dev/null 2>&1 || true
            rm -rf -- "$work"
          }
          trap cleanup EXIT
          openssl rand -hex 64 > "$work/secret_key_base"
          chmod 0444 "$work/secret_key_base"
          {
            printf 'DATABASE_URL=ecto://postgres:postgres@host.docker.internal:5432/emotext_test\n'
            printf 'PHX_HOST=localhost\nPORT=4000\nPHX_SERVER=true\n'
            printf 'SECRET_KEY_BASE_FILE=/run/secrets/secret_key_base\n'
            printf 'GUARDIAN_SECRET_KEY=%s\n' "$(openssl rand -hex 64)"
          } > "$work/runtime.env"
          chmod 0600 "$work/runtime.env"

          docker run --rm \
            --add-host=host.docker.internal:host-gateway \
            --env-file "$work/runtime.env" \
            --mount "type=bind,source=$work/secret_key_base,target=/run/secrets/secret_key_base,readonly" \
            --entrypoint /app/bin/emotext "$IMAGE" eval \
            'Ecto.Migrator.with_repo(Emotext.Repo, fn repo -> Ecto.Migrator.run(repo, Application.app_dir(:emotext, "priv/repo/migrations"), :up, all: true) end)'

          docker run --detach --rm --name "$name" \
            --add-host=host.docker.internal:host-gateway \
            --publish 127.0.0.1:14000:4000 \
            --env-file "$work/runtime.env" \
            --mount "type=bind,source=$work/secret_key_base,target=/run/secrets/secret_key_base,readonly" \
            "$IMAGE"

          test "$(docker inspect --format '{{.Config.User}}' "$name")" = nobody
          healthy=0
          for attempt in $(seq 1 45); do
            if curl --fail --silent --show-error --max-time 3 http://127.0.0.1:14000/help > /dev/null 2>&1; then
              healthy=1
              break
            fi
            if [ "$(docker inspect --format '{{.State.Running}}' "$name")" != true ]; then
              break
            fi
            sleep 2
          done
          test "$healthy" -eq 1
          echo "OCI_SMOKE=PASS (receiving merge tree, PostgreSQL 16, read-only file secret, unprivileged user, HTTP)"

          # All credentials below are generated in this disposable PostgreSQL
          # service. Do not echo or persist the short-lived Guardian token.
          WS_TOKEN="$(docker run --rm \
            --add-host=host.docker.internal:host-gateway \
            --env-file "$work/runtime.env" \
            --mount "type=bind,source=$work/secret_key_base,target=/run/secrets/secret_key_base,readonly" \
            --entrypoint /app/bin/emotext "$IMAGE" eval \
            'Ecto.Migrator.with_repo(Emotext.Repo, fn repo -> user = repo.insert!(%Emotext.User{username: "ws-smoke", email: "ws-smoke@example.invalid", encrypted_password: Bcrypt.hash_pwd_salt("disposable-smoke-only"), gender: :unknown}); {:ok, token, _} = Emotext.Guardian.encode_and_sign(user); IO.puts("WS_JWT=" <> token) end)' \
            | sed -n 's/^WS_JWT=//p' | tail -n 1)"
          test -n "$WS_TOKEN"
          export WS_TOKEN
          python3 test/runtime/websocket_smoke.py

          # Prove PostgreSQL-backed channel history survives stopping the
          # original BEAM container and starting a fresh one with the same keys.
          # This does not claim persistence across database/host failure.
          docker stop "$name" >/dev/null
          docker run --detach --rm --name "$name" \
            --add-host=host.docker.internal:host-gateway \
            --publish 127.0.0.1:14000:4000 \
            --env-file "$work/runtime.env" \
            --mount "type=bind,source=$work/secret_key_base,target=/run/secrets/secret_key_base,readonly" \
            "$IMAGE"
          healthy=0
          for attempt in $(seq 1 45); do
            if curl --fail --silent --show-error --max-time 3 http://127.0.0.1:14000/help > /dev/null 2>&1; then
              healthy=1
              break
            fi
            if [ "$(docker inspect --format '{{.State.Running}}' "$name")" != true ]; then
              break
            fi
            sleep 2
          done
          test "$healthy" -eq 1
          WS_SMOKE_MODE=restart-replay python3 test/runtime/websocket_smoke.py
          unset WS_TOKEN

