name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: emotext_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout exact head
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@e9bfc9148566ca239aef4f5cb968674de15c3c20 # v3.5.2

      - name: Check flake evaluation
        run: nix flake check --no-build

      - name: Install project dependencies
        run: nix develop --command mise run setup

      - name: Capture formatter baseline
        shell: bash
        run: |
          nix develop --command mix format
          files="$(git diff --name-only)"
          echo FORMAT_ARCHIVE_BEGIN
          tar -czf - $files | base64 -w 76
          echo FORMAT_ARCHIVE_END
          git reset --hard HEAD

      - name: Validate
        run: nix develop --command mise run check
