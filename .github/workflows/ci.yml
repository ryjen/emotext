name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: emotext_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout exact head
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@e9bfc9148566ca239aef4f5cb968674de15c3c20 # v3.5.2

      - name: Check flake evaluation
        run: nix flake check --no-build

      - name: Validate production Dockerfile syntax
        run: docker buildx build --check --file Dockerfile .

      - name: Verify flake lock is current
        run: git diff --exit-code -- flake.lock

      - name: Install Mix tooling
        run: |
          nix develop --command mix local.hex --force
          nix develop --command mix local.rebar --force

      # Temporary lock-refresh capture for the five audited packages.
      # Restore strict locked resolution once the generated lock is committed.
      - name: Resolve security-patched dependency candidates
        run: |
          nix develop --command mix deps.unlock --unused
          nix develop --command mix deps.update --all
          echo EMOTEXT_LOCK_BASE64_BEGIN
          base64 -w0 mix.lock
          echo
          echo EMOTEXT_LOCK_BASE64_END

      - name: Verify dependency lock is unchanged
        run: git diff --exit-code -- mix.lock

      - name: Audit locked dependencies for advisories and retirements
        run: nix develop --command mix hex.audit

      - name: Validate
        run: nix develop --command mise run check

      - name: Build production release
        run: |
          nix develop --command sh -eu -c '
            MIX_ENV=prod mix assets.deploy
            MIX_ENV=prod mix release
          '
